version: '3.8'

services:
  # Backend API
  backend:
    build: .
    container_name: finance-fraud-api
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - API_KEY=${API_KEY:-dev-api-key}
      - CORS_ORIGINS=http://localhost:8080,http://localhost:3000
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - DEVICE=cpu
      - USE_FP16=False
      - CHROMA_PERSIST_DIRECTORY=./data/chroma_db
      - CASES_DB_PATH=./data/cases.db
      - GRAPHS_DIRECTORY=./data/graphs
      - EMBEDDING_MODEL=./models/fin-e5
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: finance-fraud-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Pull model on startup (optional - comment out if model already exists)
    # command: >
    #   sh -c "ollama serve & sleep 5 && ollama pull llama3.1:8b"

  # Frontend (optional - can deploy separately)
  frontend:
    build:
      context: ./prd-pathfinder-69
      dockerfile: Dockerfile
    container_name: finance-fraud-frontend
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama_data:
    driver: local

